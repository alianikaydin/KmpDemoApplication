name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets the secret scan run over the whole history on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The GitHub Packages token is set per job, only on the jobs that run Gradle, so third-party
# actions such as the secret scan never see it.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Read access to the contract library on GitHub Packages.
      ORG_GRADLE_PROJECT_kmpDemoBackendUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_kmpDemoBackendPassword: ${{ secrets.GPR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Static checks
        run: scripts/ci/static-checks.sh

      - name: Verify database schema
        run: scripts/ci/verify-database-schema.sh

      - name: Upload database schema snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-schema
          path: shared/src/commonMain/sqldelight/databases/

      - name: Run shared unit tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build Android app
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Check App Store release config
        run: scripts/ci/check-app-store-release-config.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: shared/build/reports/tests/

  # Runs in parallel with build-and-test: the production web distribution takes
  # far longer than everything else in CI, so it must not delay that feedback.
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Read access to the contract library on GitHub Packages.
      ORG_GRADLE_PROJECT_kmpDemoBackendUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_kmpDemoBackendPassword: ${{ secrets.GPR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        run: ./gradlew :webApp:wasmJsBrowserDistribution :webApp:jsBrowserDistribution -PkmpEnv=prod --stacktrace

  ios-test:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Read access to the contract library on GitHub Packages.
      ORG_GRADLE_PROJECT_kmpDemoBackendUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_kmpDemoBackendPassword: ${{ secrets.GPR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run shared iOS simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/

  # Scans the commits of a push or pull request. Run the workflow manually (workflow_dispatch) to
  # scan the full history. No Gradle credentials here.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists a pull request's commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # [[allowlists]] in .gitleaks.toml needs 8.25.0 or newer.
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_ENABLE_COMMENTS: "false"
