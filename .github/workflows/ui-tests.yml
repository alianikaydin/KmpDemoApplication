name: UI Tests

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Independent from ci.yml on purpose. Master runs are never cancelled.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned in one place; both jobs install exactly this Maestro version.
  MAESTRO_VERSION: "2.0.10"

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT_DIR: ui-results/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          mkdir -p "$OUT_DIR"
          echo build > "$OUT_DIR/stage"
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: bash scripts/ui-tests/install-maestro.sh

      - name: Run Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: androidApp/build/outputs/apk/debug/androidApp-debug.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ui-tests/run-android.sh

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-results
          path: ui-results/android/
          retention-days: 14
          if-no-files-found: warn
