name: UI Tests

# Skeleton: only the iOS simulator build for now. The Maestro flows and the
# Android job are added in later commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-ui:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build iOS app for the simulator
        run: |
          set -o pipefail
          mkdir -p ui-results/ios
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee ui-results/ios/xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-results
          path: ui-results/ios/
          retention-days: 14
          if-no-files-found: warn
