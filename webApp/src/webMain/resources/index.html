<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApplication</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <!--
      Language override (see docs/localization.md). Compose Resources read navigator.languages, so
      the app language chosen in Settings is injected here. This must run before webApp.js.
      The browser language is only read again on a page reload.
    -->
    <script type="application/javascript">
        (function () {
            var languagesDescriptor = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
            var languageDescriptor = Object.getOwnPropertyDescriptor(Navigator.prototype, "language");
            if (!languagesDescriptor || !languageDescriptor) {
                return;
            }
            var browserLanguage = languageDescriptor.get.call(navigator) || "en";

            Object.defineProperty(Navigator.prototype, "languages", {
                configurable: true,
                get: function () {
                    return window.__customLocale ? [window.__customLocale] : languagesDescriptor.get.call(this);
                }
            });
            Object.defineProperty(Navigator.prototype, "language", {
                configurable: true,
                get: function () {
                    return window.__customLocale ? window.__customLocale : languageDescriptor.get.call(this);
                }
            });

            // An empty tag restores the browser language.
            window.__setAppLocale = function (tag) {
                window.__customLocale = tag ? tag : null;
                document.documentElement.lang = tag ? tag : browserLanguage;
            };
        })();
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
