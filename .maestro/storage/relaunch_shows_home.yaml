# Used by scripts/ui-tests/check-ios-session-storage.sh, not by the flows/ suite.
# Restarts the app without clearing its data and expects the stored session to open Home.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd:   # see subflows/launch_clean.yaml
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 60000
