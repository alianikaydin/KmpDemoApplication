# A version below the minimum shows the required-update screen instead of the app (AC-1), the store
# button reports a store that cannot be opened and keeps the screen (AC-4), and on Android Back does not
# get past the screen (AC-2): the login screen is not shown after Back, and bringing the same running
# app back to the front (no restart, no launch argument) shows the screen again from its in-process state.
# CI has no store to open: the Android emulator image has no Play Store and the iOS dev build has no
# App Store ID (docs/app-updates.md). On a device with the store, the store button opens it instead.
appId: ${APP_ID}
---
- runFlow:
    file: ../subflows/launch_with_version_policy.yaml
    env:
      VERSION_POLICY: required
      EXPECT_ID: force_update_screen
- assertNotVisible:
    id: login_title
- tapOn:
    id: force_update_open_store
- extendedWaitUntil:
    visible:
      id: update_store_error
    timeout: 20000
- assertVisible:
    id: force_update_screen
- runFlow:
    when:
      platform: Android
    commands:
      # Back must not get past the screen: the app goes to the background and the app behind is not shown.
      - back
      - assertNotVisible:
          id: login_title
      # stopApp: false and no arguments, so the process is not restarted and the screen has to come back
      # from the state the app already holds.
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          visible:
            id: force_update_screen
          timeout: 20000
      - assertNotVisible:
          id: login_title
- takeScreenshot: 13_force_update_screen
