# env-config AC-7: Settings shows the environment and the version.
# The Maestro build is the dev flavor/configuration, so the environment is DEV.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: demo@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- runFlow: ../subflows/dismiss_consent_prompt.yaml
- tapOn:
    id: home_settings_button
# The privacy section can push the environment line below the fold.
- scrollUntilVisible:
    element:
      id: settings_environment
    direction: DOWN
- assertVisible:
    id: settings_environment
    text: ".*DEV.*"
# The label is localized; "<label> <name> (<code>)" is matched without the label.
- assertVisible:
    id: settings_version
    text: ".* \\(\\d+\\)"
- takeScreenshot: 06_settings_environment
