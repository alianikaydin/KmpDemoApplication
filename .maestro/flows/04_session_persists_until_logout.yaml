# ios-keychain AC-2: a logged-in session survives an app restart.
# ios-keychain AC-3: after logout, a restart shows Login.
# On iOS this exercises the real Keychain, which simulator unit tests cannot reach.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: demo@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- launchApp:
    stopApp: true
- waitForAnimationToEnd:   # see subflows/launch_clean.yaml
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 60000
- takeScreenshot: 04_home_after_restart
- tapOn:
    id: home_settings_button
# Settings is taller than a small screen; the button may start below the fold.
- scrollUntilVisible:
    element:
      id: settings_logout_button
    direction: DOWN
- tapOn:
    id: settings_logout_button
- extendedWaitUntil:
    visible:
      id: login_title
    timeout: 20000
- launchApp:
    stopApp: true
- waitForAnimationToEnd:   # see subflows/launch_clean.yaml
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: login_title
    timeout: 60000
- assertNotVisible:
    id: home_title
