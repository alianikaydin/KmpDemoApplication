# The consent-pending user accepts the prompt: the switch is on, can be turned off, and the prompt does not
# come back at the next login (AC-8, AC-15).
# The mock keeps decisions in memory only, so the app is not restarted between the steps.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: consent@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: consent_screen
    timeout: 20000
- tapOn:
    id: consent_accept
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- tapOn:
    id: home_settings_button
- scrollUntilVisible:
    element:
      id: settings_consent_toggle
    direction: DOWN
- assertVisible:
    id: settings_consent_toggle
    checked: true
- tapOn:
    id: settings_consent_toggle
- extendedWaitUntil:
    visible:
      id: settings_consent_toggle
      checked: false
    timeout: 20000
- scrollUntilVisible:
    element:
      id: settings_logout_button
    direction: DOWN
- tapOn:
    id: settings_logout_button
- extendedWaitUntil:
    visible:
      id: login_title
    timeout: 20000
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: consent@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible:
    id: consent_screen
- takeScreenshot: 11_home_after_second_login
