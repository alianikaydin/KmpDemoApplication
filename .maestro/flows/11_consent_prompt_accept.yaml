# The consent-pending user accepts the prompt: the switch is on, can be turned off, and the prompt does not
# The on/off state is asserted with `checked:` on Android only; on iOS Compose does not expose it (docs/ui-tests.md), so iOS asserts the outcome: the screens and the prompt (or no prompt) that follow.
# come back at the next login (AC-8, AC-15).
# The mock keeps decisions in memory only, so the app is not restarted between the steps.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: consent@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: consent_screen
    timeout: 20000
- tapOn:
    id: consent_accept
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- tapOn:
    id: home_settings_button
- scrollUntilVisible:
    element:
      id: settings_consent_toggle
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: settings_consent_toggle
          checked: true
- tapOn:
    id: settings_consent_toggle
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: settings_consent_toggle
            checked: false
          timeout: 20000
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: settings_consent_toggle
          checked: false
- scrollUntilVisible:
    element:
      id: settings_logout_button
    direction: DOWN
- tapOn:
    id: settings_logout_button
- extendedWaitUntil:
    visible:
      id: login_title
    timeout: 20000
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: consent@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible:
    id: consent_screen
- takeScreenshot: 11_home_after_second_login
