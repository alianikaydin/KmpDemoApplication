# The consent-pending user accepts the prompt: the switch is on, can be turned off, and the prompt does not
# come back at the next login (AC-8, AC-15).
# The mock keeps decisions in memory only, so the app is not restarted between the steps.
# On iOS this flow checks navigation and that the prompt does not come back; it does not check the decision value (Compose does not expose it to XCUITest, see docs/ui-tests.md). On Android `checked:` is asserted.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: consent@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: consent_screen
    timeout: 20000
- tapOn:
    id: consent_accept
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- tapOn:
    id: home_settings_button
- scrollUntilVisible:
    element:
      id: settings_consent_toggle
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: settings_consent_toggle
          checked: true
- tapOn:
    id: settings_consent_toggle
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: settings_consent_toggle
            checked: false
            enabled: true
          timeout: 20000
- runFlow:
    when:
      platform: iOS
    commands:
      # The switch is disabled while the decision is being saved.
      - extendedWaitUntil:
          visible:
            id: settings_consent_toggle
            enabled: true
          timeout: 20000
- runFlow: ../subflows/logout_from_settings.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: consent@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible:
    id: consent_screen
- takeScreenshot: 11_home_after_second_login
