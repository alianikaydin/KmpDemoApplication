# Demo email with a wrong password shows an error and stays on Login.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: demo@example.com
      PASSWORD: WrongPass1
- extendedWaitUntil:
    visible:
      id: login_form_error
    timeout: 20000
- assertVisible:
    id: login_title
- assertNotVisible:
    id: home_title
- takeScreenshot: 03_wrong_password
