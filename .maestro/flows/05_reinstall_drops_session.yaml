# ios-keychain AC-5: clearing app data (like a reinstall) shows Login, even
# though iOS keeps Keychain items. The Keychain is deliberately NOT cleared here.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_clean.yaml
- runFlow:
    file: ../subflows/login_with.yaml
    env:
      EMAIL: demo@example.com
      PASSWORD: Demo1234
- extendedWaitUntil:
    visible:
      id: home_title
    timeout: 20000
# Clear and launch as separate steps, see subflows/launch_clean.yaml.
- stopApp
- clearState
- waitForAnimationToEnd:
    timeout: 3000
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - waitForAnimationToEnd:   # see subflows/launch_clean.yaml
          timeout: 5000
      - extendedWaitUntil:
          visible:
            id: login_title
          timeout: 30000
- assertNotVisible:
    id: home_title
- takeScreenshot: 05_login_after_reinstall
