# Fills in the Login form and submits it.
# Requires the EMAIL and PASSWORD env vars.
appId: ${APP_ID}
---
- tapOn:
    id: login_email_input
- inputText: ${EMAIL}
- tapOn:
    id: login_password_input
- inputText: ${PASSWORD}
# Dismiss the keyboard by tapping the title: `hideKeyboard` is unreliable on iOS
# and the keyboard can cover the submit button.
- tapOn:
    id: login_title
- tapOn:
    id: login_submit_button
