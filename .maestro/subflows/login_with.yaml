# Fills in the Login form and submits it.
# Requires the EMAIL and PASSWORD env vars.
appId: ${APP_ID}
---
- tapOn:
    id: login_email_input
- inputText: ${EMAIL}
- tapOn:
    id: login_password_input
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: login_submit_button
# On iOS the keyboard covers the submit button and Compose does not dismiss it
# on an outside tap, so submit with the keyboard's Done key (ImeAction.Done
# triggers the same LoginClicked event as the button).
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
