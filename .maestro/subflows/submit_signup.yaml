# Submits the filled sign-up form. The last field typed must be the confirm-password field.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: signup_submit_button
          direction: DOWN
      - tapOn:
          id: signup_submit_button
# On iOS the keyboard covers the submit button and Compose does not dismiss it on an outside tap,
# so submit with the keyboard's Done key (the confirm-password field's ImeAction.Done sends the
# same event as the button), like subflows/login_with.yaml.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
